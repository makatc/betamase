version: '3.9'

services:
  metabase:
    build:
      context: ../
      dockerfile: Dockerfile.custom
    container_name: metabase
    restart: always
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabaseappdb
      MB_DB_PORT: 5432
      MB_DB_USER: metabase_user
      MB_DB_PASS: metabase_password
      MB_DB_HOST: metabase-db
    depends_on:
      - metabase-db
    networks:
      - metabase-network

  metabase-db:
    image: postgres:14-alpine
    container_name: metabase-db
    restart: always
    environment:
      POSTGRES_USER: metabase_user
      POSTGRES_PASSWORD: metabase_password
      POSTGRES_DB: metabaseappdb
    volumes:
      - metabase-db-data:/var/lib/postgresql/data
    networks:
      - metabase-network

  nginx:
    image: nginx:alpine
    container_name: metabase-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - metabase
    networks:
      - metabase-network

networks:
  metabase-network:
    driver: bridge

volumes:
  metabase-db-data:
