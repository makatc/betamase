events {
    worker_connections 1024;
}

http {
    upstream metabase {
        server metabase:3000;
    }

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://metabase;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_addrs;
        }
    }
}
